<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT</title></head><body style="margin:0;background:#050816;color:white"><script>
(async()=>{try{const r=await fetch('./data/orbit-1.txt');if(!r.ok)throw new Error('게임 데이터 HTTP '+r.status);const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap">게임 로딩 실패: '+e+'\n\nCodespaces에서는 로컬 서버로 실행해 주세요.</pre>';}})();
</script></body></html>
