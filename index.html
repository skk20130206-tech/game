<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT</title></head><body style="margin:0;background:#050816;color:white"><script>
(async()=>{try{const r=await fetch('./data/orbit-1.txt',{cache:'no-store'});if(!r.ok)throw new Error('게임 데이터 HTTP '+r.status);const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. Chrome/Edge 최신 버전을 사용해 주세요.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<pre style="padding:20px;white-space:pre-wrap;font:16px/1.5 monospace">게임 로딩 실패: '+e+'\n\nCloudflare 배포 설정을 확인해 주세요.</pre>';console.error(e);}})();
</script></body></html>
